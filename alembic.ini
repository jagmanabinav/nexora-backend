# Alembic Configuration

[alembic]
# Path to migration scripts
script_location = migrations

# Template used to generate migration file names
file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present
# defaults to the current working directory
prepend_sys_path = .

# Timezone to use when rendering the date
# within the migration file as well as the filename.
# string value is passed to the `timezone.gettz()` function from the
# `dateutil` library
# Leave as `None` to skip timestamp rendering
# timezone =

# Max length of characters to apply to the
# "slug" field
# truncate_slug_len = 40

# Set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = False

# Set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory
# sourceless = False

# If true, revision files will be given a new id
# with "`hg id`" (Mercurial) or "`git describe`" (git)
# by default, which will make the timeline linear.
# enable_branch_autogenerate = False

# A format string to be used to render the date
# and time into new migration filenames
# ignore the keys in the structure below
# %%(rev)s - revision id
# %%(slug)s - shorthand description
# %%(ts)s - timestamp
# %%(utc_date)s - datetime object in UTC
# %%(utc_ts)s - timestamp in UTC
# date_format = %%(rev)s_%%(slug)s_%%(ts)s

sqlalchemy.url = postgresql://nexora_user:nexora_password@127.0.0.1:5433/nexora_platform_db

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
